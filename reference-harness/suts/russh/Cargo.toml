[package]
name = "smlearn-russh-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa"] }
rand = "=0.10.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[profile.release]
strip = true
lto = "thin"
